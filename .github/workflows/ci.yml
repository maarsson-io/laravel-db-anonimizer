name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, mbstring, pdo_sqlite, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Validate Composer Files
        run: composer validate --strict --no-check-publish

      # The lockfile includes dependencies requiring PHP 8.4, so resolve a compatible set on PHP 8.3.
      - name: Resolve PHP 8.3 Dependencies
        if: matrix.php == '8.3'
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Install Locked Dependencies
        if: matrix.php != '8.3'
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Tests
        run: composer test
